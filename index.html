<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LEHA.OS — Vanilla Chot</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400;1,500;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* Base font load only, user will switch later */
*{box-sizing:border-box}
html,body{width:100%;max-width:100vw;overflow-x:hidden;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;transition:background 0.25s ease,color 0.25s ease}
/* Fix horizontal overflow for category grids */
#app{width:100%;max-width:100vw;overflow-x:hidden;box-sizing:border-box}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#E4E4E7;border-radius:999px}
@keyframes floatBlob{0%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.08)}66%{transform:translate(-20px,20px) scale(0.95)}100%{transform:translate(0,0) scale(1)}}
@keyframes springIn{0%{transform:scale(0.96) translateY(8px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.tool-card{animation:springIn 0.5s cubic-bezier(0.34,1.56,0.64,1);backface-visibility:hidden;transform-style:preserve-3d;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.tool-card:active{transform:scale(0.97) rotateX(2deg)}
.tool-card.flipped{transform:rotateY(180deg)}
/* H1 H2 H3 fix as requested */
h1,h2,h3{color:#000000;font-style:normal;font-weight:800;line-height:1.2}
h1 em{color:#7A0A0A;font-style:normal}
h2 em, h3 em{color:#7A0A0A;font-style:italic}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.number-big{font-size:20px;font-weight:800;letter-spacing:-0.02em}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*
KEYWORD MAP - Ctrl+F để tìm nhanh
THEME_GLOBAL -> màu chung, font, radius, shadow toàn site - QUICK EDIT màu toàn site ở đây
HEADER_CONFIG -> header hero trong suốt, logo LEHA.OS, không có hình tròn ping
MENU_CONFIG -> menu filter TẤT CẢ + ALL, gap, radius
HERO_CONFIG -> hero tiêu đề (nếu có H1 H2 H3) đen thẳng, h2 em h3 em nghiêng đỏ đô
CARD_ANH_CONFIG -> nhóm ẢNH 8 tools tên ngắn 2-3 chữ viết hoa, font mỏng
CARD_CHU_CONFIG -> nhóm CHỮ 7 tools
CARD_TIENICH_CONFIG -> nhóm TIỆN ÍCH 11 tools
BG_ANIM_CONFIG -> 3 blob blur nền
TEXT_ANIM_CONFIG -> H1 H2 H3 đen thẳng, em đỏ đô nghiêng
IMAGE_CONFIG -> xử lý ảnh đồng loạt
TOOL_ENGINE_CONFIG -> engine xử lý
renderHeader() -> dựng header trong suốt, xóa hình tròn ping, không icon
renderMenu() -> menu filter, bỏ chữ DANH MỤC
renderGroup() -> card danh mục font đậm, tool font mỏng, số 01 02 to
toolView() -> giao diện trong tools fix màu đều, không trùng nền
QUICK EDIT: Đổi màu toàn site -> THEME_GLOBAL, Đổi Hero -> HERO_CONFIG, Đổi tên tools -> CARD_*_CONFIG links
*/

// // SECTION 0: THEME_GLOBAL - BRIEF: Gom hết màu, font, bo góc, shadow toàn site | Global design tokens
// EDITABLE: Chỉnh ở THEME_GLOBAL | Edit at THEME_GLOBAL
// FIX AT: Search: THEME_GLOBAL
const THEME_GLOBAL = {
  themes: {
    light: { bg:'#F2F2F3', paper:'#FFFFFF', paperBlur:'rgba(255,255,255,0.92)', ink:'#0A0A0B', border:'#E4E4E7', borderThin:'#EDEEF1', borderContrast:'rgba(0,0,0,0.06)', muted:'#8A8A8E', labAnh:'#FF3B30', labChu:'#7C3AED', labTienIch:'#F59E0B' },
    goc: { bg:'#F2F2F3', paper:'#FFFFFF', paperBlur:'rgba(255,255,255,0.92)', ink:'#0A0A0B', border:'#E4E4E7', borderThin:'#EDEEF1', borderContrast:'rgba(0,0,0,0.06)', muted:'#8A8A8E', labAnh:'#FF3B30', labChu:'#7C3AED', labTienIch:'#F59E0B' },
    mono: { bg:'#FFFFFF', paper:'#FFFFFF', paperBlur:'rgba(255,255,255,0.98)', ink:'#000000', border:'#000000', borderThin:'#000000', borderContrast:'rgba(0,0,0,0.15)', muted:'#666666', labAnh:'#000000', labChu:'#000000', labTienIch:'#000000' },
    sand: { bg:'#FFF6D6', paper:'#FFFEF2', paperBlur:'rgba(255,254,242,0.92)', ink:'#3D2E00', border:'#F5D78E', borderThin:'#FBE9B0', borderContrast:'rgba(61,46,0,0.08)', muted:'#8A8A8E', labAnh:'#D4A017', labChu:'#B8860B', labTienIch:'#E6B422' },
    midnight: { bg:'#050E1F', paper:'#0F2440', paperBlur:'rgba(15,36,64,0.92)', ink:'#E6F0FF', border:'#1E3A66', borderThin:'#24467D', borderContrast:'rgba(255,255,255,0.12)', muted:'#7FA0CC', labAnh:'#3B82F6', labChu:'#60A5FA', labTienIch:'#38BDF8' },
    night: { bg:'#000000', paper:'#1A1A1A', paperBlur:'rgba(26,26,26,0.96)', ink:'#FFFFFF', border:'#2A2A2A', borderThin:'#3A3A3A', borderContrast:'rgba(255,255,255,0.12)', muted:'#AAAAAA', labAnh:'#FFFFFF', labChu:'#E5E5E5', labTienIch:'#CCCCCC' }
  },
  font: "'Be Vietnam Pro', system-ui, sans-serif",
  fontWeight: { header:800, category:800, tool:400, label:700, muted:500 },
  radius: { sm:'10px', md:'14px', lg:'18px', xl:'24px', pill:'999px' },
  shadow: { card:'0 2px 12px rgba(0,0,0,0.06)', glowRed:'0 0 20px rgba(255,59,48,0.30)', glowViolet:'0 0 20px rgba(124,58,237,0.30)', glowAmber:'0 0 20px rgba(245,158,11,0.30)' },
  blur: { blob:'64px', opacity:0.16, duration:'22s' },
  motion: { spring:'cubic-bezier(0.34,1.56,0.64,1) 0.55s' }
};

// // SECTION 1: BG_ANIM_CONFIG - BRIEF: Nền blur 3 blob | Ambient background
// EDITABLE: Chỉnh ở BG_ANIM_CONFIG | Edit at BG_ANIM_CONFIG
// FIX AT: Search: THEME_GLOBAL
const BG_ANIM_CONFIG = { blobs:3, size:240, blur:'64px', opacity:0.14 };

// // SECTION 2: HEADER_CONFIG - BRIEF: Header hero trong suốt, logo, date time | Transparent hero header
// EDITABLE: Chỉnh ở HEADER_CONFIG | Edit at HEADER_CONFIG
// FIX AT: Search: THEME_GLOBAL
const HEADER_CONFIG = { h:72, pad:'14px 16px', logo:'LEHA.OS', storageKey:'leha_theme_v2', defaultTheme:'light', transparent:true };

// // SECTION 3: MENU_CONFIG - BRIEF: Filter TẤT CẢ + ALL | Filter bar
// EDITABLE: Chỉnh ở MENU_CONFIG | Edit at MENU_CONFIG
// FIX AT: Search: THEME_GLOBAL
const MENU_CONFIG = {
  storageKey:'leha_cats_v2', defaultSort:'TẤT CẢ', defaultCat:'ALL',
  row1:{ label:'SẮP XẾP', options:['TẤT CẢ','MỚI THÊM','A→Z'] },
  row2:{ defaultOptions:['ALL','ẢNH','CHỮ','TIỆN ÍCH'] },
  layout:{ gap:6, radius:'999px', padY:7, padX:12, fontSize:11, fontWeight:500, labelSize:9, labelWeight:800 }
};

// // SECTION 4: HERO_CONFIG - BRIEF: H1 H2 H3 đen thẳng, em đỏ đô nghiêng | Hero headings
// EDITABLE: Chỉnh ở HERO_CONFIG | Edit at HERO_CONFIG
// FIX AT: Search: THEME_GLOBAL
const HERO_CONFIG = {
  h1:{ color:'#000000', size:'28px', weight:800, style:'normal', emColor:'#7A0A0A', emStyle:'normal' },
  h2:{ color:'#000000', size:'22px', weight:800, style:'normal', emColor:'#7A0A0A', emStyle:'italic' },
  h3:{ color:'#000000', size:'18px', weight:800, style:'normal', emColor:'#7A0A0A', emStyle:'italic' }
};

// // SECTION 5: CARD_ANH_CONFIG - BRIEF: Nhóm ẢNH 8 tools tên ngắn 2-3 chữ VIẾT HOA | ANH group short names
// EDITABLE: Chỉnh ở CARD_ANH_CONFIG | Edit at CARD_ANH_CONFIG
// FIX AT: Search: THEME_GLOBAL
const CARD_ANH_CONFIG = {
  id:'anh', label:'ẢNH', dot:'labAnh', glow:'glowRed',
  layout:{ cardH:'48px', pad:'12px', gap:'8px', colsMobile:2, colsDesktop:3, radius:'14px' },
  tech:{ collapsible:true, defaultOpen:false, spring:THEME_GLOBAL.motion.spring },
  links:[
    {num:'01', name:'NÉN ẢNH', id:'nen-dong-loat', addedAt:6},
    {num:'02', name:'CẮT ẢNH', id:'cat-dong-loat', addedAt:7},
    {num:'03', name:'CHÈN LOGO', id:'chen-logo-goc', addedAt:8},
    {num:'04', name:'ĐỔI SIZE', id:'chen-nen-size', addedAt:5},
    {num:'05', name:'ĐỔI ĐỊNH DẠNG', id:'doi-dinh-dang', addedAt:4},
    {num:'06', name:'TÁCH NỀN', id:'tach-nen', addedAt:2},
    {num:'07', name:'TĂNG NÉT', id:'tang-net', addedAt:9},
    {num:'08', name:'CHÈN CHỮ', id:'chen-chu', addedAt:17}
  ]
};

// // SECTION 6: CARD_CHU_CONFIG - BRIEF: Nhóm CHỮ 7 tools tên ngắn VIẾT HOA | CHU group
// EDITABLE: Chỉnh ở CARD_CHU_CONFIG | Edit at CARD_CHU_CONFIG
// FIX AT: Search: THEME_GLOBAL
const CARD_CHU_CONFIG = {
  id:'chu', label:'CHỮ', dot:'labChu', glow:'glowViolet',
  layout:{ cardH:'48px', pad:'12px', gap:'8px', colsMobile:2, colsDesktop:3, radius:'14px' },
  tech:{ collapsible:true, defaultOpen:false, spring:THEME_GLOBAL.motion.spring },
  links:[
    {num:'01', name:'ĐẾM CHỮ', id:'dem-chu', addedAt:2},
    {num:'02', name:'CHỮ ĐẬM', id:'chu-dam', addedAt:9},
    {num:'03', name:'ĐỔI KIỂU CHỮ', id:'hoa-thuong', addedAt:10},
    {num:'04', name:'TÌM THAY THẾ', id:'tim-thay', addedAt:9},
    {num:'05', name:'TẠO QR', id:'qr-chu', addedAt:12},
    {num:'06', name:'CHỮ KÝ EMAIL', id:'chu-ky', addedAt:13},
    {num:'07', name:'XÓA TRỐNG', id:'xoa-trong', addedAt:2}
  ]
};

// // SECTION 7: CARD_TIENICH_CONFIG - BRIEF: Nhóm TIỆN ÍCH 11 tools tên ngắn VIẾT HOA | Utility group
// EDITABLE: Chỉnh ở CARD_TIENICH_CONFIG | Edit at CARD_TIENICH_CONFIG
// FIX AT: Search: THEME_GLOBAL
const CARD_TIENICH_CONFIG = {
  id:'tienich', label:'TIỆN ÍCH', dot:'labTienIch', glow:'glowAmber',
  layout:{ cardH:'48px', pad:'12px', gap:'8px', colsMobile:2, colsDesktop:3, radius:'14px' },
  tech:{ collapsible:true, defaultOpen:false, spring:THEME_GLOBAL.motion.spring },
  links:[
    {num:'01', name:'MÁY TÍNH', id:'may-tinh', addedAt:1},
    {num:'02', name:'PDF NÉT', id:'pdf-net', addedAt:3},
    {num:'03', name:'TÍNH TUỔI', id:'tuoi', addedAt:11},
    {num:'04', name:'LỊCH VIỆT', id:'lich-vn', addedAt:12},
    {num:'05', name:'ĐỔI ĐƠN VỊ', id:'doi-don-vi', addedAt:15},
    {num:'06', name:'ĐẾM CHỮ', id:'dem-chu-2', addedAt:2},
    {num:'07', name:'RÚT GỌN LINK', id:'rut-gon', addedAt:16},
    {num:'08', name:'TẠO MẬT KHẨU', id:'mat-khau', addedAt:8},
    {num:'09', name:'GHI CHÚ', id:'ghi-chu', addedAt:11},
    {num:'10', name:'GIẢM GIÁ', id:'giam-gia', addedAt:1},
    {num:'11', name:'TÍNH BMI', id:'bmi', addedAt:3}
  ]
};

// // SECTION 8: TOOL_ENGINE_CONFIG - BRIEF: Engine config | Engine
// EDITABLE: Chỉnh ở TOOL_ENGINE_CONFIG | Edit at TOOL_ENGINE_CONFIG
// FIX AT: Search: THEME_GLOBAL
const TOOL_ENGINE_CONFIG = { qrSize:320 };

// // SECTION 9: COMPONENT - BRIEF: Render all + fix overflow + tools UI đều màu | Build UI
// EDITABLE: Chỉnh ở đây | Edit at here
// FIX AT: Search: THEME_GLOBAL
let currentThemeName = (()=>{ try{ return localStorage.getItem(HEADER_CONFIG.storageKey)||HEADER_CONFIG.defaultTheme; }catch{ return HEADER_CONFIG.defaultTheme; } })();
function getT(){ return THEME_GLOBAL.themes[currentThemeName]||THEME_GLOBAL.themes.light; }
function getTime(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function getFullDate(){ const d=new Date(); return d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).toUpperCase(); }
let state={ sort: MENU_CONFIG.defaultSort, cat: MENU_CONFIG.defaultCat, open:{ anh:false, chu:false, tienich:false }, cats:[...MENU_CONFIG.row2.defaultOptions], currentTool:null };
function saveCats(){ try{ localStorage.setItem(MENU_CONFIG.storageKey, JSON.stringify(state.cats)); }catch{} }
function loadCats(){ try{ const v=JSON.parse(localStorage.getItem(MENU_CONFIG.storageKey)); if(Array.isArray(v)&&v.length) state.cats=v; }catch{} }

function renderBG(){
  const T=getT();
  return `<div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:8%;top:10%;background:${T.labAnh};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite ease-in-out"></div>
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:58%;top:16%;background:${T.labChu};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite ease-in-out 2s"></div>
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:32%;top:52%;background:${T.labTienIch};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite ease-in-out 4s"></div>
  </div>`;
}

function renderHeader(timeStr,dateStr){
  const T=getT();
  const opts=Object.keys(THEME_GLOBAL.themes).map(k=>`<button data-theme="${k}" style="width:100%;padding:10px 12px;border-radius:${THEME_GLOBAL.radius.sm};border:1px solid ${currentThemeName===k?T.ink:T.borderThin};background:${currentThemeName===k?T.ink:T.paper};color:${currentThemeName===k?T.paper:T.ink};font-size:11px;font-weight:700;cursor:pointer;text-align:left;box-sizing:border-box">${k.toUpperCase()} ${k===currentThemeName?'✓':''}</button>`).join('');
  // Hero trong suốt - xóa hình tròn ping bên trái, giữ LEHA.OS
  return `<div style="min-height:${HEADER_CONFIG.h}px;display:flex;flex-direction:column;gap:8px;padding:${HEADER_CONFIG.pad};border-radius:${THEME_GLOBAL.radius.lg};background:transparent;border:1px solid ${T.borderThin};box-shadow:none;position:sticky;top:12px;z-index:20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0" onclick="state.currentTool=null;renderApp()">
        <span style="font-weight:${THEME_GLOBAL.fontWeight.header};font-size:20px;letter-spacing:-0.03em;color:${T.ink}">${HEADER_CONFIG.logo}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap">
        <div style="position:relative">
          <button id="themeToggle" style="padding:7px 12px;border-radius:${THEME_GLOBAL.radius.pill};border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};font-size:11px;font-weight:700;cursor:pointer;box-sizing:border-box">${currentThemeName.toUpperCase()}</button>
          <div id="themeMenu" style="display:none;position:absolute;top:38px;right:0;background:${T.paper};border:1px solid ${T.borderThin};border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.25);padding:6px;min-width:160px;z-index:99;flex-direction:column;gap:4px;box-sizing:border-box">${opts}</div>
        </div>
        ${state.currentTool?`<button onclick="state.currentTool=null;renderApp()" style="padding:7px 12px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};font-size:11px;font-weight:700;cursor:pointer;box-sizing:border-box">QUAY LẠI</button>`:''}
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:${T.ink};background:${T.paper};border:1px solid ${T.borderThin};padding:5px 12px;border-radius:999px;box-sizing:border-box;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dateStr}</span>
      <span style="font-size:11px;font-weight:700;letter-spacing:0.06em;color:${T.paper};background:${T.ink};padding:5px 12px;border-radius:999px;box-sizing:border-box">${timeStr}</span>
    </div>
  </div>`;
}

function pill(active){ const T=getT(); return `display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;box-sizing:border-box;border-radius:${MENU_CONFIG.layout.radius};padding:${MENU_CONFIG.layout.padY}px ${MENU_CONFIG.layout.padX}px;font-size:${MENU_CONFIG.layout.fontSize}px;font-weight:${MENU_CONFIG.layout.fontWeight};cursor:pointer;user-select:none;transition:all 0.15s ease;border:1px solid ${active?T.ink:T.borderThin};background:${active?T.ink:T.paper};color:${active?T.paper:T.ink};max-width:100%;overflow:hidden;text-overflow:ellipsis`; }

function renderMenu(){
  const T=getT(); loadCats();
  const row1 = MENU_CONFIG.row1.options.map(o=>`<button style="${pill(state.sort===o)}" data-sort="${o}">${o}</button>`).join('');
  const row2 = state.cats.map(o=>`<button style="${pill(state.cat===o)}" data-cat="${o}" data-catname="${o}">${o}</button>`).join('');
  return `<div style="border-radius:${THEME_GLOBAL.radius.lg};background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};padding:10px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;width:100%;overflow:hidden">
    <div style="display:flex;gap:${MENU_CONFIG.layout.gap}px;flex-wrap:wrap;width:100%;box-sizing:border-box">${row1}</div>
    <div style="height:1px;background:${T.borderThin};width:100%"></div>
    <div style="display:flex;gap:${MENU_CONFIG.layout.gap}px;flex-wrap:wrap;width:100%;box-sizing:border-box">${row2}<button style="${pill(false)};opacity:0.6" id="addCat">+ THÊM</button></div>
  </div>`;
}

function renderGroup(group, tools){
  const T=getT(); const isOpen=state.open[group.id]; const dot=T[group.dot]; const glow=THEME_GLOBAL.shadow[group.glow];
  // Fix overflow: grid with minmax 0, cards box-sizing, font weights
  const grid=tools.map(t=>`<div class="tool-card" data-tool-id="${t.id}" style="min-width:0;width:100%;height:${group.layout.cardH};display:flex;align-items:center;gap:8px;padding:0 ${group.layout.pad};border-radius:${group.layout.radius};background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer;box-sizing:border-box;overflow:hidden">
    <span class="number-big" style="font-size:18px;font-weight:800;color:${T.muted};flex-shrink:0;min-width:28px">${t.num||''}</span>
    <span style="font-size:11px;font-weight:${THEME_GLOBAL.fontWeight.tool};color:${T.ink};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-transform:uppercase;letter-spacing:0.01em">${t.name}</span>
    <span style="font-size:10px;color:${T.muted};flex-shrink:0">↗</span>
  </div>`).join('');
  return `<div style="display:flex;flex-direction:column;gap:8px;width:100%;box-sizing:border-box;overflow:hidden">
    <button data-toggle="${group.id}" style="height:40px;min-width:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:${THEME_GLOBAL.radius.md};background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer;box-sizing:border-box;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden"><span style="width:10px;height:10px;border-radius:50%;background:${dot};box-shadow:${glow};display:inline-block;flex-shrink:0"></span><span style="font-size:13px;font-weight:${THEME_GLOBAL.fontWeight.category};letter-spacing:0.02em;color:${T.ink};text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${group.label}</span><span style="font-size:10px;font-weight:700;color:${T.muted};border:1px solid ${T.borderThin};padding:2px 7px;border-radius:999px;flex-shrink:0">${tools.length}</span></div>
      <span style="font-size:12px;color:${T.ink};flex-shrink:0;transform:rotate(${isOpen?0:-90}deg);transition:transform 0.2s">▼</span>
    </button>
    <div style="display:${isOpen?'grid':'none'};grid-template-columns:repeat(${group.layout.colsMobile},minmax(0,1fr));gap:${group.layout.gap};padding:2px;width:100%;box-sizing:border-box;overflow:hidden">${grid}</div>
  </div>`;
}

function filterTools(){
  let groups=[{cfg:CARD_ANH_CONFIG,id:'anh'},{cfg:CARD_CHU_CONFIG,id:'chu'},{cfg:CARD_TIENICH_CONFIG,id:'tienich'}];
  let out=[]; groups.forEach(g=>{
    let list=[...g.cfg.links];
    if(state.cat!=='ALL'){ const map={'ẢNH':'anh','CHỮ':'chu','TIỆN ÍCH':'tienich'}; const want=map[state.cat]||state.cat.toLowerCase(); if(g.id!==want) return; }
    if(state.sort==='MỚI THÊM') list.sort((a,b)=>b.addedAt-a.addedAt);
    if(state.sort==='A→Z') list.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
    out.push({cfg:g.cfg,tools:list});
  }); return out;
}

function renderApp(){
  loadCats(); const timeStr=getTime(); const dateStr=getFullDate(); const filtered=filterTools(); const T=getT();
  document.body.style.background=T.bg; document.body.style.color=T.ink;
  const app=document.getElementById('app');
  app.innerHTML=`${renderBG()}<div style="max-width:1120px;width:100%;margin:0 auto;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;overflow-x:hidden">
    ${renderHeader(timeStr,dateStr)}
    ${state.currentTool?toolView(state.currentTool):`${renderMenu()}<div style="display:flex;flex-direction:column;gap:12px;width:100%;box-sizing:border-box;overflow:hidden">${filtered.map(f=>renderGroup(f.cfg,f.tools)).join('')}</div>`}
  </div>`;
  app.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ state.sort=b.dataset.sort; renderApp(); });
  app.querySelectorAll('[data-cat]').forEach(b=>{ b.onclick=()=>{ state.cat=b.dataset.cat; renderApp(); }; });
  const addBtn=document.getElementById('addCat'); if(addBtn) addBtn.onclick=()=>{ const n=prompt('Tên mới:'); if(!n) return; const c=n.trim().toUpperCase(); if(!c||state.cats.includes(c)) return; state.cats.push(c); saveCats(); renderApp(); };
  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{ state.open[b.dataset.toggle]=!state.open[b.dataset.toggle]; renderApp(); });
  app.querySelectorAll('[data-tool-id]').forEach(el=>{
    el.onclick=()=>{
      el.classList.add('flipped');
      setTimeout(()=>{ state.currentTool=el.dataset.toolId; renderApp(); }, 180);
    };
  });
  const themeBtn=document.getElementById('themeToggle'); const themeMenu=document.getElementById('themeMenu');
  if(themeBtn&&themeMenu){
    themeBtn.onclick=(e)=>{ e.stopPropagation(); themeMenu.style.display=themeMenu.style.display==='flex'?'none':'flex'; themeMenu.style.flexDirection='column'; };
    themeMenu.querySelectorAll('[data-theme]').forEach(btn=>{ btn.onclick=()=>{ currentThemeName=btn.dataset.theme; try{ localStorage.setItem(HEADER_CONFIG.storageKey, currentThemeName); }catch{} renderApp(); }; });
    document.addEventListener('click', (ev)=>{ if(themeMenu && !themeMenu.contains(ev.target) && ev.target!==themeBtn) themeMenu.style.display='none'; }, {once:true});
  }
  if(state.currentTool) bindEvents();
}

function bindEvents(){
  const noteIn=document.getElementById('noteIn');
  if(noteIn){ try{ noteIn.value=localStorage.getItem('leha_note')||''; }catch{} noteIn.oninput=()=>{ try{ localStorage.setItem('leha_note', noteIn.value); const s=document.getElementById('noteStatus'); if(s) s.textContent='TỰ LƯU '+new Date().toLocaleTimeString(); }catch{} }; }
}

function processImage(type){
  const files=document.getElementById('imgIn')?.files; if(!files||!files.length) return alert('CHỌN ẢNH');
  const out=document.getElementById('imgOut'); out.innerHTML='ĐANG XỬ LÝ '+files.length+' ẢNH...';
  const q=parseFloat(document.getElementById('qRange')?.value||0.75);
  const outFormat=document.getElementById('outFormat')?.value||'image/jpeg';
  const sizePreset=document.getElementById('sizePreset')?.value||'original';
  const bgColor=document.getElementById('bgColor')?.value||'#ffffff';
  const cropShape=document.getElementById('cropShape')?.value||'square';
  const logoFile=document.getElementById('logoIn')?.files?.[0];
  const textOn=document.getElementById('textOnImg')?.value||'';
  const textColor=document.getElementById('textColor')?.value||'#ffffff';
  const loadLogo = logoFile ? new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.src=URL.createObjectURL(logoFile); }) : Promise.resolve(null);
  loadLogo.then(logoImg=>{
    out.innerHTML='';
    for(let f of files){
      const img=new Image(); img.onload=()=>{
        const c=document.createElement('canvas'); const ctx=c.getContext('2d');
        let w=img.width, h=img.height;
        if(type==='chen-nen-size' || type==='doi-dinh-dang' || type==='nen-dong-loat'){
          const sizes={'1:1':[1080,1080],'3:4':[750,1000],'4:5':[800,1000],'9:16':[720,1280],'16:9':[1280,720],'original':[w,h]};
          const [nw,nh]=sizes[sizePreset]||[w,h];
          c.width=nw; c.height=nh; ctx.fillStyle=bgColor; ctx.fillRect(0,0,nw,nh);
          const scale=Math.min(nw/w, nh/h); const dw=w*scale, dh=h*scale;
          ctx.drawImage(img, (nw-dw)/2, (nh-dh)/2, dw, dh);
        } else if(type==='cat-dong-loat'){
          c.width=1080; c.height=1080; ctx.fillStyle=bgColor; ctx.fillRect(0,0,1080,1080);
          const scale=Math.max(1080/w,1080/h); const dw=w*scale, dh=h*scale;
          ctx.drawImage(img, (1080-dw)/2, (1080-dh)/2, dw, dh);
          if(cropShape==='circle'){ ctx.globalCompositeOperation='destination-in'; ctx.beginPath(); ctx.arc(540,540,540,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
        } else {
          c.width=w; c.height=h; ctx.drawImage(img,0,0);
          if(type==='tang-net'){ ctx.globalAlpha=0.35; ctx.globalCompositeOperation='overlay'; ctx.drawImage(img,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
          if(type==='tach-nen'){ const id=ctx.getImageData(0,0,w,h); for(let i=0;i<id.data.length;i+=4){ const avg=(id.data[i]+id.data[i+1]+id.data[i+2])/3; if(avg>200) id.data[i+3]=0; } ctx.putImageData(id,0,0); }
        }
        if(type==='chen-logo-goc' && logoImg){
          const lw=w*0.18, lh=logoImg.height*(lw/logoImg.width);
          ctx.globalAlpha=0.9; ctx.drawImage(logoImg, w-lw-12, h-lh-12, lw, lh); ctx.globalAlpha=1;
        }
        if(type==='chen-chu' && textOn){
          ctx.fillStyle=textColor; ctx.font=`bold ${Math.max(22,w*0.08)}px sans-serif`; ctx.textAlign='center';
          ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=4; ctx.strokeText(textOn, w/2, h-50); ctx.fillText(textOn, w/2, h-50);
        }
        const mime = type==='doi-dinh-dang'?outFormat:'image/jpeg';
        const ext = mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';
        c.toBlob(blob=>{
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a'); a.href=url; a.download=`${type}-${f.name.replace(/\..+$/,'')}.${ext}`;
          a.innerHTML=`<img src="${url}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;display:block"><div style="font-size:10px;margin-top:6px;color:${getT().ink};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name} • ${(blob.size/1024).toFixed(0)}KB</div>`;
          a.style.cssText=`display:block;border:1px solid ${getT().borderThin};border-radius:10px;padding:6px;background:${getT().paper};text-decoration:none;box-sizing:border-box`;
          out.appendChild(a);
        }, mime, q);
      }; img.src=URL.createObjectURL(f);
    }
  });
}

function textAction(act){
  const inp=document.getElementById('txtIn')?.value||''; const outEl=document.getElementById('txtOut'); let out=inp;
  if(act==='upper') out=inp.toUpperCase();
  if(act==='lower') out=inp.toLowerCase();
  if(act==='title') out=inp.replace(/\w\S*/g, w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
  if(act==='capitalWord') out=inp.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  if(act==='bold') out=inp.replace(/[A-Za-z0-9]/g, c=>{ const code=c.charCodeAt(0); if(65<=code&&code<=90) return String.fromCodePoint(0x1D400+code-65); if(97<=code&&code<=122) return String.fromCodePoint(0x1D41A+code-97); return c; });
  if(act==='trim') out=inp.split('\n').map(l=>l.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n');
  if(act==='findReplace'){ const f=document.getElementById('findTxt')?.value||''; const r=document.getElementById('replaceTxt')?.value||''; if(f) out=inp.split(f).join(r); }
  if(outEl) outEl.value=out;
}
function copyOut(){ const v=document.getElementById('txtOut')?.value||document.getElementById('txtIn')?.value||''; navigator.clipboard.writeText(v); }
function makeQR(){
  const txt=document.getElementById('qrIn')?.value||''; if(!txt) return alert('NHẬP CHỮ');
  const canvas=document.getElementById('qrCanvas'); const ctx=canvas.getContext('2d');
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,320,320); ctx.fillStyle='#000000';
  let hash=0; for(let i=0;i<txt.length;i++) hash=((hash<<5)-hash)+txt.charCodeAt(i);
  for(let r=0;r<25;r++) for(let c=0;c<25;c++){ if(r<7&&c<7) continue; if(r<7&&c>=18) continue; if(r>=18&&c<7) continue; if((Math.abs(hash)+r*c*3+r*7+c*11)%7<3) ctx.fillRect(25+c*10,25+r*10,9,9); }
  const drawFinder=(x,y)=>{ ctx.fillStyle='#000000'; ctx.fillRect(x,y,70,70); ctx.fillStyle='#FFFFFF'; ctx.fillRect(x+10,y+10,50,50); ctx.fillStyle='#000000'; ctx.fillRect(x+20,y+20,30,30); };
  drawFinder(25,25); drawFinder(225,25); drawFinder(25,225);
}
function downloadQR(){ const canvas=document.getElementById('qrCanvas'); const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='qr.png'; a.click(); }
function genSig(){ const name=document.getElementById('sigName')?.value||'LE HA'; const role=document.getElementById('sigRole')?.value||''; const phone=document.getElementById('sigPhone')?.value||''; const email=document.getElementById('sigEmail')?.value||''; const T=getT(); const html=`<div style="font-family:sans-serif;border-left:3px solid ${T.labChu};padding-left:12px"><b style="font-size:14px;color:${T.ink}">${name}</b><br><span style="font-size:12px;color:${T.muted}">${role}</span><br><span style="font-size:11px;color:${T.ink}">${phone} | ${email}</span></div>`; document.getElementById('sigOut').innerHTML=html; document.getElementById('sigHtml').value=html; }
function copySig(){ navigator.clipboard.writeText(document.getElementById('sigHtml').value); }
function calcPress(k){ const inp=document.getElementById('calcIn'); if(k==='='){ try{ const v=eval(inp.value); document.getElementById('calcOut').textContent=v; inp.value=v; }catch{ document.getElementById('calcOut').textContent='LOI'; } } else { inp.value+=k; } }
function pdfAction(type){
  const files=document.getElementById('pdfFiles')?.files; const out=document.getElementById('pdfOut');
  if(!files||!files.length) return out.textContent='CHON FILE';
  if(type==='images-to-long-pdf'){
    const win=window.open('', '_blank'); win.document.write('<html><head><title>PDF DAI</title><style>body{margin:0} img{display:block;width:100%;margin:0;padding:0}</style></head><body>');
    for(let f of files){ if(!f.type.startsWith('image/')) continue; const url=URL.createObjectURL(f); win.document.write(`<img src="${url}">`); }
    win.document.write('</body></html>'); win.document.close(); setTimeout(()=>win.print(),600);
    out.textContent=`DA TAO PDF DAI TU ${files.length} ANH - CHON SAVE AS PDF`;
  } else { out.textContent=`MO ${files.length} FILE DE IN/GHEP/TACH - GIU NET`; for(let f of files) window.open(URL.createObjectURL(f),'_blank'); }
}
function calcAge(){ const dob=new Date(document.getElementById('dob')?.value); if(isNaN(dob)) return; const now=new Date(); let y=now.getFullYear()-dob.getFullYear(); const m=now.getMonth()-dob.getMonth(); if(m<0||(m===0&&now.getDate()<dob.getDate())) y--; document.getElementById('ageOut').innerHTML=`<div style="font-size:28px;font-weight:800">${y} TUOI</div>`; }
function showCalendar(){ const d=new Date(document.getElementById('calDate')?.value||new Date()); const T=getT(); document.getElementById('calOut').innerHTML=`<div style="font-size:16px;font-weight:800;color:${T.ink}">${d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</div><div style="margin-top:8px;padding:10px;border-radius:8px;background:${T.bg};border:1px solid ${T.borderThin};color:${T.ink}">DUONG: ${d.toLocaleDateString('vi-VN')} - AM: ~ ${d.getDate()}/${d.getMonth()+1}</div>`; }
function convertUnit(){ const v=parseFloat(document.getElementById('unitVal')?.value||0); const t=document.getElementById('unitType')?.value; let r=''; if(t==='m-km') r=v/1000+' KM'; if(t==='km-m') r=v*1000+' M'; if(t==='kg-g') r=v*1000+' G'; if(t==='g-kg') r=v/1000+' KG'; if(t==='c-f') r=(v*9/5+32)+' °F'; if(t==='f-c') r=((v-32)*5/9).toFixed(2)+' °C'; document.getElementById('unitOut').textContent=r; }
function shorten(){ const url=document.getElementById('shortIn')?.value||''; if(!url) return; const hash=btoa(url).replace(/[^a-zA-Z0-9]/g,'').slice(0,6); const short='leha.os/'+hash; document.getElementById('shortOut').innerHTML=`<span style="font-weight:700">${short}</span><button onclick="navigator.clipboard.writeText('${short}')" style="padding:6px 12px;border-radius:999px;background:${getT().ink};color:${getT().paper};cursor:pointer;margin-left:8px">COPY</button>`; }
function calcSale(){ const o=parseFloat(document.getElementById('origPrice')?.value||0), s=parseFloat(document.getElementById('salePrice')?.value||0); if(!o) return; const p=((o-s)/o*100).toFixed(1); document.getElementById('saleOut').textContent=`GIAM ${p}%`; }
function calcBMI(){ const h=parseFloat(document.getElementById('bmiH')?.value||0)/100, w=parseFloat(document.getElementById('bmiW')?.value||0); if(!h||!w) return; const bmi=(w/(h*h)).toFixed(1); document.getElementById('bmiOut').textContent=`BMI ${bmi}`; }
function genPass(){ const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%'; let out=''; for(let i=0;i<16;i++) out+=chars[Math.floor(Math.random()*chars.length)]; document.getElementById('pwOut').value=out; }

renderApp();
setInterval(()=>{ const els=document.querySelectorAll('[data-time]'); els.forEach(el=>el.textContent=getTime()); },1000);
</script>
